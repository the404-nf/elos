<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Resonant DS — cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: var(--color-surface-canvas); }
  .cover { position: relative; width: 960px; height: 300px; overflow: hidden; font-family: var(--font-family-sans), Inter, system-ui, sans-serif; }
  .name { position: absolute; left: 40px; bottom: 56px; margin: 0; font-size: 96px; line-height: .92; font-weight: 600; letter-spacing: -0.02em; color: var(--color-text-primary); max-width: 440px; }
  .tag { position: absolute; left: 42px; bottom: 28px; margin: 0; font-size: 14px; color: var(--color-text-secondary); max-width: 440px; }
  svg { position: absolute; top: 0; left: 0; }
  .brand { fill: var(--color-blue-500); }
  .ink { fill: var(--color-text-primary); }
  .tint { fill: var(--color-blue-100); }
  .signal { fill: var(--color-red-500); }
  .ring { fill: none; stroke: var(--color-surface-canvas); stroke-width: 1px; }
  .r-lg { rx: var(--radius-lg); }
  .r-md { rx: var(--radius-md); }
</style>
</head>
<body>
<div class="cover">
  <!--
    blocks: color-blue-500 (brand) 288x300 tall slab bleeding off top/right; color-text-primary (ink) 144x144; color-blue-100 (tint) 144x96; color-red-500 (signal) 48x48
    arrangement: one tall slab at the right edge with satellites stacked to its left on a 48px grid (space-6 x 2), sides multiples of space-6
    pattern: literal motif (resonance) -> concentric arcs cut from the brand slab in the ground color, pitch space-6, "Resonant" is the name and a wave is what resonance looks like
    scales: space-6 = 24px pitch and grid, radius-lg on the slab corner, radius-md on satellites
  -->
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <rect class="brand r-lg" x="672" y="-24" width="312" height="348"/>
    <g class="ring">
      <circle cx="960" cy="300" r="48"/>
      <circle cx="960" cy="300" r="96"/>
      <circle cx="960" cy="300" r="144"/>
      <circle cx="960" cy="300" r="192"/>
      <circle cx="960" cy="300" r="240"/>
    </g>
    <rect class="ink r-md" x="504" y="132" width="144" height="144"/>
    <rect class="tint r-md" x="504" y="24" width="144" height="96"/>
    <rect class="signal r-md" x="456" y="228" width="48" height="48"/>
  </svg>
  <h1 class="name">Resonant</h1>
  <p class="tag">Contracts first. Every channel, every agent, the same components.</p>
</div>
</body>
</html>
