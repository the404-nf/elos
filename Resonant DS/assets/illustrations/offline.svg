<svg xmlns="http://www.w3.org/2000/svg" class="rs-il" width="240" height="160" viewBox="0 0 240 160" aria-hidden="true"><style>.rs-il{color:var(--color-illustration-line,#0b0b0f)}
.rs-il .ln{fill:none;stroke:var(--color-illustration-line,#0b0b0f);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.rs-il .pl{fill:var(--color-illustration-plane,#fff);stroke:var(--color-illustration-line,#0b0b0f);stroke-width:1.5;stroke-linejoin:round}
.rs-il .cs{fill:none;stroke:var(--color-illustration-construction,#6b6a74);stroke-width:1;stroke-dasharray:3 3;stroke-linecap:round}
.rs-il rect.cs{fill:var(--il-ground,var(--color-surface-overlay,#fff))}
.rs-il .tk{fill:none;stroke:var(--color-illustration-construction,#6b6a74);stroke-width:1;stroke-linecap:round}
.rs-il .ac{fill:var(--il-accent,var(--color-illustration-line,#0b0b0f))}
.rs-il .acl{fill:var(--il-ground,var(--color-surface-overlay,#fff));stroke:var(--il-accent,var(--color-illustration-line,#0b0b0f));stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.rs-il path.acl{fill:none}
.rs-il .cut{fill:none;stroke:var(--il-ground,var(--color-surface-overlay,#fff));stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.rs-il .lb{font:500 7px var(--font-family-mono,'JetBrains Mono',ui-monospace,monospace);letter-spacing:.06em;text-transform:uppercase;fill:var(--color-illustration-construction,#6b6a74);paint-order:stroke;stroke:var(--il-ground,var(--color-surface-overlay,#fff));stroke-width:3px;stroke-linejoin:round}
.rs-il .gl{font:800 22px var(--font-family-display,'Inter Tight',sans-serif);letter-spacing:-.04em}
